<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>diltru. | A price tracker that saves you money</title>
    <link rel="shortcut icon" type="image/png" href="{% static 'favicon.png' %}"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Sticky Footer Setup */
        body { 
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        main { flex: 1; } /* Pushes footer down */
        
        .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: none; }
        .navbar-brand { font-weight: bold; color: #ffffff !important; } 
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">diltru.</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <div class="d-flex" id="auth-section">
                    </div>
            </div>
        </div>
    </nav>

    <main class="container">
        <div id="alert-box"></div>
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-dark text-white-50 text-center py-3 mt-5">
        <div class="container">
            <small>
                All Rights Reserved &copy; {% now "Y" %} &#9702; Made with &#129293; by 
                <a href="https://gurthii.github.io/" target="_blank" class="text-white text-decoration-none">Joseph.</a>
            </small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> 

    <script>
        const authToken = localStorage.getItem('diltru_token');
        const authSection = document.getElementById('auth-section');

        if (authToken) {
            authSection.innerHTML = `
                <a href="/dashboard/" class="btn btn-outline-light me-2">Dashboard</a>
                <button onclick="logout()" class="btn btn-danger">Logout</button>
            `;
        } else {
            authSection.innerHTML = `
                <a href="/login/" class="btn btn-outline-light me-2">Login</a>
                <a href="/register/" class="btn btn-warning">Register</a>
            `;
        }

        function logout() {
            localStorage.removeItem('diltru_token');
            localStorage.removeItem('diltru_username'); // Clean up username too
            window.location.href = '/login/';
        }
    </script>

    {% block extra_js %}{% endblock %}

</body>
</html>
